name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: |
          go vet ./...
          $unformatted = gofmt -l cmd internal
          if ($unformatted) { $unformatted; exit 1 }

      - name: Build binaries
        run: .\build.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            Write-Host 'Inno Setup missing on this runner, installing it'
            choco install innosetup --no-progress -y
          }

      # 普通推送：只证明安装包编得出来，产物存成 Actions artifact。
      # tag：跳过这一步，交给下面的 Package release 统一出正式产物，
      # 否则 dist\ 里会同时躺着 zinc-0.0.0-dev-setup.exe 和正式包，一起被传上 Release。
      - name: Build installer (dev build)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: .\installer\build.ps1 -Version 0.0.0-dev

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: zinc-windows-amd64
          path: |
            zinc.exe
            zincw.exe
            zinc-register.exe
            zinc-unregister.exe
            zinc.ico
            dist/*-setup.exe
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # 从空的 dist 开始，发布包里只会有本次 tag 的产物
          Remove-Item dist -Recurse -Force -ErrorAction SilentlyContinue
          .\package.ps1 -Version ${{ github.ref_name }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
          generate_release_notes: true
