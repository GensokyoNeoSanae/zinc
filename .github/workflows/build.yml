name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and format
        run: |
          go vet ./...
          $unformatted = gofmt -l cmd internal
          if ($unformatted) { $unformatted; exit 1 }

      - name: Build binaries
        run: .\build.ps1

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            Write-Host 'Inno Setup missing on this runner, installing it'
            choco install innosetup --no-progress -y
          }

      - name: Build installer
        run: .\installer\build.ps1 -Version 0.0.0-dev

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zinc-windows-amd64
          path: |
            zinc.exe
            zincw.exe
            zinc-register.exe
            zinc-unregister.exe
            zinc.ico
            dist/*-setup.exe
          if-no-files-found: error

      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: .\package.ps1 -Version ${{ github.ref_name }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*.zip
          generate_release_notes: true
